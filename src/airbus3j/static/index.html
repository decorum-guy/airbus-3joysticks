<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airbus 3 Joysticks</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071019;
      --panel: #0c1823;
      --panel2: #101f2c;
      --line: #264052;
      --text: #e9f1f6;
      --muted: #8fa7b7;
      --cyan: #63d7ff;
      --green: #55d58b;
      --amber: #f4bf5f;
      --red: #ff7575;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% -20%, #153047 0, var(--bg) 45%);
      color: var(--text);
    }
    header {
      position: sticky; top: 0; z-index: 4;
      background: rgba(7,16,25,.9); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex; gap: 16px; align-items: center; justify-content: space-between;
    }
    h1 { font-size: 18px; margin: 0; letter-spacing: .03em; }
    .status-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--line); background: var(--panel);
      border-radius: 999px; padding: 5px 10px; color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .dot.ok { background: var(--green); box-shadow: 0 0 12px rgba(85,213,139,.5); }
    main { max-width: 1650px; margin: 0 auto; padding: 20px; }
    .notice {
      border: 1px solid #4a4130; background: rgba(244,191,95,.08); color: #e7d3a8;
      padding: 10px 12px; border-radius: 10px; margin-bottom: 16px;
    }
    .controllers {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start;
    }
    .card {
      background: linear-gradient(180deg, rgba(16,31,44,.96), rgba(9,20,29,.96));
      border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
      box-shadow: 0 14px 30px rgba(0,0,0,.18);
    }
    .card.online { border-color: rgba(85,213,139,.5); }
    .card.assigning { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(244,191,95,.14); }
    .card-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
    .role-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .role-name { font-weight: 750; letter-spacing: .025em; }
    .device-name { color: var(--cyan); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .identity { color: var(--muted); font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 5px; word-break: break-all; }
    .actions { display: flex; gap: 7px; margin-top: 10px; }
    button {
      border: 1px solid #34556d; background: #112b3d; color: var(--text);
      border-radius: 8px; padding: 7px 10px; cursor: pointer; font-weight: 650;
    }
    button:hover { background: #17384e; }
    button.secondary { background: transparent; color: var(--muted); }
    .controller {
      position: relative; height: 420px; margin: 14px;
      border: 1px solid #29475c; border-radius: 48px 48px 92px 92px;
      background: radial-gradient(circle at 50% 15%, #172c3b, #0b1721 68%);
      overflow: hidden;
    }
    .shoulder {
      position: absolute; top: 18px; width: 34%; height: 34px;
      border: 1px solid #36566a; border-radius: 13px; background: #132634;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 11px; padding: 4px; color: #cfe4ef;
    }
    .shoulder.left { left: 7%; } .shoulder.right { right: 7%; }
    .stick {
      position: absolute; width: 118px; height: 118px; border-radius: 50%;
      border: 2px solid #3a5a70; background: radial-gradient(circle, #183245 0 36%, #0b1721 38% 100%);
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 12px; font-weight: 800; font-size: 12px; color: var(--cyan);
    }
    .stick.left { left: 13%; top: 155px; } .stick.right { right: 13%; top: 210px; }
    .stick-click {
      position: absolute; width: 145px; color: var(--muted); text-align: center; font-size: 11px;
    }
    .stick-click.left { left: 7%; top: 280px; } .stick-click.right { right: 7%; top: 335px; }
    .dpad {
      position: absolute; left: 12%; top: 75px; width: 125px; height: 73px;
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px;
      font-size: 9px; color: #d2e0e8;
    }
    .dpad div { display: flex; align-items: center; justify-content: center; text-align: center; }
    .dpad .up { grid-column: 2; grid-row: 1; } .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .center { grid-column: 2; grid-row: 2; background: #1d3342; border-radius: 5px; }
    .dpad .right { grid-column: 3; grid-row: 2; } .dpad .down { grid-column: 2; grid-row: 3; }
    .faces { position: absolute; right: 8%; top: 72px; width: 155px; height: 130px; }
    .face {
      position: absolute; width: 44px; min-height: 44px; border-radius: 50%;
      border: 1px solid #3d5c70; background: #142735;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 4px; font-size: 8px; line-height: 1.1;
    }
    .face strong { color: var(--cyan); font-size: 13px; margin-bottom: 2px; }
    .face.up { left: 55px; top: 0; } .face.left { left: 5px; top: 43px; }
    .face.right { right: 5px; top: 43px; } .face.down { left: 55px; bottom: 0; }
    .pending { color: var(--amber) !important; }
    .binding-list { border-top: 1px solid var(--line); padding: 10px 14px 14px; }
    .binding-row { display: grid; grid-template-columns: minmax(100px,.8fr) minmax(140px,1.3fr); gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(38,64,82,.42); }
    .binding-row:last-child { border-bottom: 0; }
    .trigger { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { font-size: 12px; }
    details { border-top: 1px solid var(--line); }
    summary { cursor: pointer; padding: 10px 14px; color: var(--muted); }
    .editor { padding: 0 14px 14px; }
    textarea {
      width: 100%; min-height: 230px; resize: vertical; background: #07121a; color: #d9e7ef;
      border: 1px solid var(--line); border-radius: 9px; padding: 10px;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .editor-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    .error { color: var(--red); font-size: 11px; }
    .footer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .info-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .info-panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 11px; color: #c8d8e2; }
    @media (max-width: 1150px) { .controllers { grid-template-columns: 1fr; } .controller { height: 390px; max-width: 560px; margin-left: auto; margin-right: auto; } }
  </style>
</head>
<body>
<header>
  <h1>AIRBUS · 3 JOYSTICKS</h1>
  <div class="status-row">
    <span class="pill"><span id="wsDot" class="dot"></span><span id="wsText">Panel connecting…</span></span>
    <span class="pill"><span id="simDot" class="dot"></span><span id="simText">SimConnect…</span></span>
  </div>
</header>
<main>
  <div class="notice">MVP rule: bindings marked <b>pending</b> are visible but intentionally do nothing. Exact Airbus FCU push/pull and EFIS actions will be enabled only after they are verified.</div>
  <div id="controllers" class="controllers"></div>
  <div class="footer-grid">
    <section class="info-panel"><h2>Last input</h2><pre id="lastInput">—</pre></section>
    <section class="info-panel"><h2>Detected devices</h2><pre id="devices">—</pre></section>
  </div>
</main>
<script>
const ROLES = ["left", "center", "right"];
let currentState = null;
const editorsDirty = new Set();

function binding(role, trigger) {
  return (role.bindings || []).find(b => b.trigger === trigger);
}
function label(role, trigger, fallback="—") {
  return binding(role, trigger)?.label || fallback;
}
function pendingClass(b) {
  if (!b) return "";
  const actions = [b.action, b.clockwise, b.counter_clockwise].filter(Boolean);
  return actions.some(a => a.type === "pending") ? "pending" : "";
}
function faceGlyph(deviceName, logical) {
  const n = (deviceName || "").toLowerCase();
  const ps = n.includes("dualsense") || n.includes("wireless controller") || n.includes("playstation");
  if (!ps) return ({x:"X", a:"A", b:"B", y:"Y"})[logical];
  return ({x:"□", a:"×", b:"○", y:"△"})[logical];
}
function deviceIdentity(role) {
  const d = role.runtime_device || role.device;
  if (!d) return "not assigned";
  if (d.serial) return `serial: ${d.serial}`;
  if (d.path) return `serial unavailable · path fallback: ${d.path}`;
  return `serial/path unavailable · ${d.device_key || "fallback identity"}`;
}
function actionPending(role, trigger) { return pendingClass(binding(role, trigger)); }

function controllerCard(roleKey, role) {
  const assigning = currentState.assignment_target === roleKey;
  const name = role.runtime_device?.name || role.device?.name || "No controller assigned";
  const bLeftRot = binding(role, "rotary:left");
  const bRightRot = binding(role, "rotary:right");
  const bL3 = binding(role, "leftstick");
  const bL3Mod = binding(role, "leftshoulder+leftstick");
  const bR3 = binding(role, "rightstick");
  const bR3Mod = binding(role, "leftshoulder+rightstick");

  return `
  <section class="card ${role.online ? "online" : ""} ${assigning ? "assigning" : ""}" id="card-${roleKey}">
    <div class="card-head">
      <div class="role-line"><div class="role-name">${escapeHtml(role.display_name)}</div><span>${role.online ? "● ONLINE" : "○ OFFLINE"}</span></div>
      <div class="device-name">${escapeHtml(name)}</div>
      <div class="identity">${escapeHtml(deviceIdentity(role))}</div>
      <div class="actions">
        <button onclick="armAssign('${roleKey}')">${assigning ? "Press a button now…" : "Assign controller"}</button>
        <button class="secondary" onclick="clearAssign('${roleKey}')">Clear</button>
      </div>
    </div>
    <div class="controller">
      <div class="shoulder left ${actionPending(role,'leftshoulder')}">L1 / LB<br>${escapeHtml(label(role,'leftshoulder','modifier / free'))}</div>
      <div class="shoulder right ${actionPending(role,'rightshoulder')}">R1 / RB<br>${escapeHtml(label(role,'rightshoulder','free'))}</div>
      <div class="dpad">
        <div class="up ${actionPending(role,'dpad_up')}">↑<br>${escapeHtml(label(role,'dpad_up',''))}</div>
        <div class="left ${actionPending(role,'dpad_left')}">←<br>${escapeHtml(label(role,'dpad_left',''))}</div>
        <div class="center">D-PAD</div>
        <div class="right ${actionPending(role,'dpad_right')}">→<br>${escapeHtml(label(role,'dpad_right',''))}</div>
        <div class="down ${actionPending(role,'dpad_down')}">↓<br>${escapeHtml(label(role,'dpad_down',''))}</div>
      </div>
      <div class="faces">
        ${face(role,name,'y','up')}
        ${face(role,name,'x','left')}
        ${face(role,name,'b','right')}
        ${face(role,name,'a','down')}
      </div>
      <div class="stick left ${pendingClass(bLeftRot)}">↻ ↺<br>${escapeHtml(bLeftRot?.label || 'LEFT STICK')}</div>
      <div class="stick-click left ${pendingClass(bL3)}">L3: ${escapeHtml(bL3?.label || 'free')}<br>L1+L3: ${escapeHtml(bL3Mod?.label || 'free')}</div>
      <div class="stick right ${pendingClass(bRightRot)}">↻ ↺<br>${escapeHtml(bRightRot?.label || 'RIGHT STICK')}</div>
      <div class="stick-click right ${pendingClass(bR3)}">R3: ${escapeHtml(bR3?.label || 'free')}<br>L1+R3: ${escapeHtml(bR3Mod?.label || 'free')}</div>
    </div>
    <div class="binding-list">${(role.bindings || []).map(bindingRow).join('')}</div>
    <details>
      <summary>Edit this controller bindings (JSON)</summary>
      <div class="editor">
        <textarea id="editor-${roleKey}" oninput="editorsDirty.add('${roleKey}')"></textarea>
        <div class="editor-footer"><span class="error" id="error-${roleKey}"></span><button onclick="saveBindings('${roleKey}')">Save & live update</button></div>
      </div>
    </details>
  </section>`;
}
function face(role, name, logical, pos) {
  const b = binding(role, logical);
  return `<div class="face ${pos} ${pendingClass(b)}"><strong>${faceGlyph(name,logical)}</strong>${escapeHtml(b?.label || 'free')}</div>`;
}
function bindingRow(b) {
  return `<div class="binding-row"><div class="trigger">${escapeHtml(b.trigger)}</div><div class="label ${pendingClass(b)}">${escapeHtml(b.label)}</div></div>`;
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function render(state) {
  currentState = state;
  const sim = state.simconnect || {};
  document.getElementById('simDot').className = `dot ${sim.connected ? 'ok' : ''}`;
  document.getElementById('simText').textContent = sim.connected ? `SimConnect · connected · ${sim.sent_events} events` : `SimConnect · offline${sim.last_error ? ' · ' + sim.last_error : ''}`;
  document.getElementById('controllers').innerHTML = ROLES.map(k => controllerCard(k, state.roles[k])).join('');
  for (const roleKey of ROLES) {
    if (!editorsDirty.has(roleKey)) {
      const editor = document.getElementById(`editor-${roleKey}`);
      if (editor) editor.value = JSON.stringify(state.roles[roleKey].bindings || [], null, 2);
    }
  }
  document.getElementById('lastInput').textContent = state.last_input ? JSON.stringify(state.last_input, null, 2) : '—';
  document.getElementById('devices').textContent = (state.available_devices || []).map((d,i) => {
    const identity = d.serial ? `serial=${d.serial}` : d.path ? `path=${d.path}` : `fallback=${d.device_key}`;
    return `${i+1}. ${d.name}\n   ${identity}`;
  }).join('\n') || 'No SDL game controllers detected.';
}
async function armAssign(role) {
  await fetch(`/api/assign/${role}`, {method:'POST'});
}
async function clearAssign(role) {
  await fetch(`/api/assign/${role}`, {method:'DELETE'});
}
async function saveBindings(role) {
  const editor = document.getElementById(`editor-${role}`);
  const error = document.getElementById(`error-${role}`);
  try {
    const parsed = JSON.parse(editor.value);
    const response = await fetch(`/api/bindings/${role}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(parsed)});
    if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
    editorsDirty.delete(role);
    error.textContent = 'saved';
    setTimeout(() => { if (error.textContent === 'saved') error.textContent=''; }, 1400);
  } catch (e) { error.textContent = e.message; }
}
function connect() {
  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${scheme}//${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('wsDot').className = 'dot ok';
    document.getElementById('wsText').textContent = 'Panel · live';
  };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => {
    document.getElementById('wsDot').className = 'dot';
    document.getElementById('wsText').textContent = 'Panel · reconnecting';
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
