<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airbus 3 Joysticks</title>
  <style>
    :root{color-scheme:dark;--bg:#061019;--panel:#0b1823;--panel2:#102230;--line:#264052;--text:#eaf2f7;--muted:#8da5b5;--cyan:#67dbff;--green:#5cdb91;--amber:#f6c667;--red:#ff7777}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -15%,#17344b 0,var(--bg) 43%);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    header{position:sticky;top:0;z-index:20;background:rgba(6,16,25,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    h1{font-size:17px;margin:0;letter-spacing:.06em} nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap} nav a{color:var(--cyan);text-decoration:none;font-weight:700} .status-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.dot.ok{background:var(--green);box-shadow:0 0 12px rgba(92,219,145,.5)}.dot.warn{background:var(--amber)}
    main{max-width:1450px;margin:0 auto;padding:20px}.topline{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.notice{border:1px solid #4a4130;background:rgba(246,198,103,.07);color:#e5d2aa;padding:9px 12px;border-radius:10px}.notice strong{color:var(--amber)}
    .fcu{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px;margin-bottom:16px}.fcu-tile{background:linear-gradient(180deg,#102331,#0a1720);border:1px solid var(--line);border-radius:14px;padding:13px 15px}.fcu-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.13em}.fcu-value{font:800 30px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan);margin-top:5px}.fcu-unit{font-size:11px;color:var(--muted);margin-left:5px}
    .controllers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.controllers.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(16,31,44,.98),rgba(8,18,27,.98));border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 15px 34px rgba(0,0,0,.2)}.card.online{border-color:rgba(92,219,145,.48)}.card.assigning{border-color:var(--amber);box-shadow:0 0 0 2px rgba(246,198,103,.15)}
    .card-head{padding:14px;border-bottom:1px solid var(--line)}.role-line{display:flex;justify-content:space-between;align-items:center;gap:10px}.role-name{font-weight:800;letter-spacing:.025em}.online-text{font-size:11px;color:var(--green)}.offline-text{font-size:11px;color:var(--muted)}.device-name{color:var(--cyan);font-weight:700;margin-top:5px}.identity{color:var(--muted);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px;word-break:break-all}.actions{display:flex;gap:7px;margin-top:10px}
    button{border:1px solid #365b74;background:#112d41;color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}button:hover{background:#173d55}button.secondary{background:transparent;color:var(--muted)}
    .sticks{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:15px}.stick-box{border:1px solid #2b485b;background:#09151e;border-radius:14px;padding:11px}.stick-title{font-weight:800;color:var(--cyan);font-size:12px;margin-bottom:8px}.stick-stage{position:relative;width:min(190px,100%);aspect-ratio:1;margin:auto;border-radius:50%;border:2px solid #35566b;background:radial-gradient(circle,#173044 0 14%,#0b1924 15% 55%,#07121a 56%);overflow:hidden}.stick-ring{position:absolute;inset:20%;border:1px dashed rgba(141,165,181,.28);border-radius:50%}.stick-dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px rgba(103,219,255,.6);transform:translate(-50%,-50%);transition:left .06s linear,top .06s linear}.stick-dot.active{background:var(--green);box-shadow:0 0 17px rgba(92,219,145,.65)}.stick-read{margin-top:7px;text-align:center;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
    .buttons{padding:0 15px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.key{border:1px solid #2d4b5f;border-radius:8px;background:#0d202c;padding:7px 5px;text-align:center;min-height:52px;display:flex;flex-direction:column;justify-content:center}.key strong{font-size:12px;color:#dceaf2}.key span{font-size:9px;color:var(--muted);line-height:1.15;margin-top:2px;overflow-wrap:anywhere}.key.pressed{border-color:var(--green);background:rgba(92,219,145,.14);box-shadow:0 0 13px rgba(92,219,145,.18)}.key.pending span{color:var(--amber)}
    details{border-top:1px solid var(--line)}summary{cursor:pointer;padding:10px 14px;color:var(--muted)}.bindings{padding:0 14px 13px}.binding-row{display:grid;grid-template-columns:minmax(95px,.8fr) minmax(140px,1.4fr);gap:8px;padding:5px 0;border-bottom:1px solid rgba(38,64,82,.4)}.binding-row:last-child{border-bottom:0}.trigger{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.binding-label{font-size:11px}.binding-label.pending{color:var(--amber)}
    .footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.info-panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}.info-panel h2{font-size:11px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:11px;color:#c8d8e2}
    @media(max-width:950px){.fcu{grid-template-columns:repeat(2,1fr)}.controllers,.controllers.three{grid-template-columns:1fr}.card{max-width:720px;width:100%;margin:auto}}@media(max-width:560px){header{align-items:flex-start;flex-direction:column}.fcu{grid-template-columns:repeat(2,1fr)}.fcu-value{font-size:23px}.buttons{grid-template-columns:repeat(3,1fr)}.sticks{grid-template-columns:1fr 1fr;padding:10px;gap:8px}}
  </style>
</head>
<body>
<header>
  <div><h1>AIRBUS · 3 JOYSTICKS</h1><nav><a href="/haptics">Haptics</a><a href="/editor">Bindings</a></nav></div>
  <div class="status-row">
    <span class="pill"><span id="readyDot" class="dot"></span><span id="readyText">Preflight…</span></span>
    <span class="pill"><span id="wsDot" class="dot"></span><span id="wsText">Panel…</span></span>
    <span class="pill"><span id="simDot" class="dot"></span><span id="simText">SimConnect…</span></span>
  </div>
</header>
<main>
  <div class="topline"><div id="centerNotice" class="notice">Loading controller profile…</div><div id="hapticBrief" class="pill">Haptics…</div></div>
  <section class="fcu">
    <div class="fcu-tile"><div class="fcu-label">Selected speed</div><div><span id="fcuSpeed" class="fcu-value">—</span><span class="fcu-unit">KT</span></div></div>
    <div class="fcu-tile"><div class="fcu-label">Heading</div><div><span id="fcuHeading" class="fcu-value">—</span><span class="fcu-unit">°</span></div></div>
    <div class="fcu-tile"><div class="fcu-label">Altitude</div><div><span id="fcuAltitude" class="fcu-value">—</span><span class="fcu-unit">FT</span></div></div>
    <div class="fcu-tile"><div class="fcu-label">Vertical speed</div><div><span id="fcuVs" class="fcu-value">—</span><span class="fcu-unit">FPM</span></div></div>
  </section>
  <div id="controllers" class="controllers"></div>
  <div class="footer-grid">
    <section class="info-panel"><h2>Last action</h2><pre id="lastAction">—</pre></section>
    <section class="info-panel"><h2>Detected devices</h2><pre id="devices">—</pre></section>
  </div>
</main>
<script>
const ROLES=["left","center","right"];
let currentState=null;
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function binding(role,trigger){return(role.bindings||[]).find(b=>b.trigger===trigger)}
function label(role,trigger,fallback="free"){return binding(role,trigger)?.label||fallback}
function isPending(b){if(!b)return false;return[b.action,b.clockwise,b.counter_clockwise].filter(Boolean).some(a=>a.type==='pending')}
function pendingFor(role,trigger){return isPending(binding(role,trigger))}
function isPressed(role,key){return !!role.input?.buttons?.[key]}
function psGlyph(name,key){const n=(name||'').toLowerCase();const ps=n.includes('ps4')||n.includes('playstation')||n.includes('dualsense')||n.includes('wireless controller');if(!ps)return({x:'X',a:'A',b:'B',y:'Y'})[key]||key.toUpperCase();return({x:'□',a:'×',b:'○',y:'△'})[key]||key.toUpperCase()}
function identity(role){const d=role.runtime_device||role.device;if(!d)return'not assigned';if(d.serial)return`serial: ${d.serial}`;if(d.path)return`path: ${d.path}`;return d.device_key||'fallback identity'}
function keyCell(role,button,title,text){return `<div class="key ${isPressed(role,button)?'pressed':''} ${pendingFor(role,button)?'pending':''}"><strong>${esc(title)}</strong><span>${esc(text)}</span></div>`}
function stickBox(role,stick){const live=role.input?.[`${stick}_stick`]||{x:0,y:0,radius:0,angle_degrees:0};const b=binding(role,`rotary:${stick}`);const x=Math.max(-1,Math.min(1,Number(live.x||0)));const y=Math.max(-1,Math.min(1,Number(live.y||0)));const left=50+x*42,top=50+y*42;const active=Number(live.radius||0)>Number(currentState?.rotary?.outer_radius??.58);return `<div class="stick-box"><div class="stick-title">${esc(b?.label||stick.toUpperCase())}</div><div class="stick-stage"><div class="stick-ring"></div><div class="stick-dot ${active?'active':''}" style="left:${left}%;top:${top}%"></div></div><div class="stick-read">x ${x.toFixed(2)} · y ${y.toFixed(2)} · r ${Number(live.radius||0).toFixed(2)} · ${Number(live.angle_degrees||0).toFixed(0)}°</div></div>`}
function controllerCard(key,role){const name=role.runtime_device?.name||role.device?.name||'No controller assigned';const assigning=currentState.assignment_target===key;const glyph=k=>psGlyph(name,k);return `<section class="card ${role.online?'online':''} ${assigning?'assigning':''}"><div class="card-head"><div class="role-line"><div class="role-name">${esc(role.display_name)}</div><span class="${role.online?'online-text':'offline-text'}">${role.online?'● ONLINE':'○ OFFLINE'}</span></div><div class="device-name">${esc(name)}</div><div class="identity">${esc(identity(role))}</div><div class="actions"><button onclick="armAssign('${key}')">${assigning?'Press a button now…':'Assign controller'}</button><button class="secondary" onclick="clearAssign('${key}')">Clear</button></div></div><div class="sticks">${stickBox(role,'left')}${stickBox(role,'right')}</div><div class="buttons">${keyCell(role,'leftstick','L3',label(role,'leftstick'))}${keyCell(role,'rightstick','R3',label(role,'rightstick'))}${keyCell(role,'leftshoulder','L1',label(role,'leftshoulder','modifier'))}${keyCell(role,'rightshoulder','R1',label(role,'rightshoulder'))}${keyCell(role,'dpad_up','↑',label(role,'dpad_up'))}${keyCell(role,'dpad_down','↓',label(role,'dpad_down'))}${keyCell(role,'dpad_left','←',label(role,'dpad_left'))}${keyCell(role,'dpad_right','→',label(role,'dpad_right'))}${keyCell(role,'x',glyph('x'),label(role,'x'))}${keyCell(role,'y',glyph('y'),label(role,'y'))}${keyCell(role,'a',glyph('a'),label(role,'a'))}${keyCell(role,'b',glyph('b'),label(role,'b'))}</div><details><summary>All bindings</summary><div class="bindings">${(role.bindings||[]).map(b=>`<div class="binding-row"><div class="trigger">${esc(b.trigger)}</div><div class="binding-label ${isPending(b)?'pending':''}">${esc(b.label)}</div></div>`).join('')}</div></details></section>`}
function fmt(v){const n=Number(v);return Number.isFinite(n)?n:null}
function setTelemetry(sim){const t=sim.telemetry||{};const speed=fmt(t.speed),heading=fmt(t.heading),alt=fmt(t.altitude),vs=fmt(t.vertical_speed);document.getElementById('fcuSpeed').textContent=speed===null?'—':Math.round(speed);document.getElementById('fcuHeading').textContent=heading===null?'—':String(Math.round(heading)%360).padStart(3,'0');document.getElementById('fcuAltitude').textContent=alt===null?'—':Math.round(alt).toLocaleString('en-US');document.getElementById('fcuVs').textContent=vs===null?'—':`${vs>0?'+':''}${Math.round(vs)}`}
function render(state){currentState=state;const sim=state.simconnect||{},r=state.readiness||{};document.getElementById('simDot').className=`dot ${sim.connected?'ok':''}`;document.getElementById('simText').textContent=sim.connected?`SimConnect · ${sim.telemetry?.aircraft_title||'connected'}`:`SimConnect · offline${sim.last_error?' · '+sim.last_error:''}`;document.getElementById('readyDot').className=`dot ${r.ready?'ok':(r.controllers_ready||r.simconnect_ready)?'warn':''}`;document.getElementById('readyText').textContent=r.ready?'READY TO FLY':r.missing_roles?.length?`Missing: ${r.missing_roles.join(', ')}`:'Waiting for MSFS';setTelemetry(sim);const active=ROLES.filter(k=>state.roles?.[k]?.enabled);const holder=document.getElementById('controllers');holder.className=`controllers ${active.length===3?'three':''}`;holder.innerHTML=active.map(k=>controllerCard(k,state.roles[k])).join('');const center=state.roles?.center;document.getElementById('centerNotice').innerHTML=center?.enabled?'<strong>CENTER enabled.</strong> Three-controller profile is active.':'<strong>Two-controller mode.</strong> CENTER / EFIS / RADIO profile is preserved but disabled until a third controller is added.';const h=state.haptics||{};document.getElementById('hapticBrief').textContent=h.enabled===false?'Haptics off':`Haptics · detent ${Math.round(Number(h.changing_values?.intensity??0)*100)}% · warning ${Math.round(Number(h.warnings?.intensity??0)*100)}%`;document.getElementById('lastAction').textContent=state.last_action?`${state.last_action.role.toUpperCase()} · ${state.last_action.label}\n${state.last_action.trigger}\n${state.last_action.result}`:'—';document.getElementById('devices').textContent=(state.available_devices||[]).map((d,i)=>`${i+1}. ${d.name}\n   ${d.serial?`serial=${d.serial}`:d.path?`path=${d.path}`:d.device_key}`).join('\n')||'No SDL game controllers detected.'}
async function armAssign(role){await fetch(`/api/assign/${role}`,{method:'POST'})}async function clearAssign(role){await fetch(`/api/assign/${role}`,{method:'DELETE'})}
function connect(){const scheme=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(`${scheme}//${location.host}/ws`);ws.onopen=()=>{document.getElementById('wsDot').className='dot ok';document.getElementById('wsText').textContent='Panel · live'};ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>{document.getElementById('wsDot').className='dot';document.getElementById('wsText').textContent='Panel · reconnecting';setTimeout(connect,1000)};ws.onerror=()=>ws.close()}
connect();
</script>
</body>
</html>
